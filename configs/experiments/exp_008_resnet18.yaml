# Hanya nilai yang berbeda dari configs/base.yaml.
# Baseline transfer learning ResNet-18 (bobot ImageNet, torchvision).
# Backbone dimuat dari src/models/baseline.py build_model("resnet18", ...).
name: exp_008_resnet18
description: >
  Baseline ResNet-18 pra-latih ImageNet, head model.fc diganti ke 7 kelas
  (transfer learning). Model residual ringan sebagai pembanding.

model:
  architecture: resnet18
  pretrained: imagenet          # bobot ResNet18_Weights.IMAGENET1K_V1
  source: torchvision
  num_classes: 7
  finetune: feature_extraction  # feature_extraction | full

data:
  # Train: set SEIMBANG 3.000/kelas (21.000 citra) hasil penyetaraan combined
  # (GCD+CCSN), sudah dimaterialisasi di data/combined_balanced/train/.
  # Lihat docs/dataset/PENYETARAAN_SAMPEL.md.
  train_dir: data/combined_balanced/train
  train_manifest: reports/tables/combined_balanced_train_manifest.csv
  # Val/test: combined APA ADANYA (distribusi nyata; TIDAK diseimbangkan).
  # Catatan: kolom rel_path di manifes val/test mencatat lokasi SUMBER asli
  # (val berprefiks train/); file fisik ada di val_dir/test_dir di bawah
  # (pola <split_dir>/<class>/<filename>). Lihat src/datasets/manifest.py.
  val_dir: data/combined/val
  val_manifest: reports/tables/combined_val_manifest.csv
  test_dir: data/combined/test
  test_manifest: reports/tables/combined_test_manifest.csv

training:
  imbalance: none   # train sudah seimbang; jangan koreksi ganda (PENYETARAAN_SAMPEL.md §2.3)

# Praproses diwarisi dari configs/base.yaml: input 512x512, normalisasi /255 -> [0,1].
